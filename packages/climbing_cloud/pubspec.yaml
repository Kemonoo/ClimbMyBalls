name: climbing_cloud
description: Climb's shared database (docs/climb/plan.md, step 7) - accounts, and places, topos, ticks and sessions shared through Supabase. Used by the standalone Climb app only.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.32.0"

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  climbing:
    path: ../climbing
  supabase_flutter: ^2.18.3
dev_dependencies:
  flutter_test:
    sdk: flutter
