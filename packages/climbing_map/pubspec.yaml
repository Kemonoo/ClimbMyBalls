name: climbing_map
description: The climbing map (docs/climb/plan.md, step 4) - Mapy.com outdoor tiles, GPS, the near-me list, filters and the place hierarchy. Used by the standalone Climb app only; hibi does not depend on it.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_svg: ^2.4.0
  geolocator: ^14.1.2
  climbing:
    path: ../climbing
  http: 1.6.0
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
  vector_map_tiles: 9.0.0-beta.13
  vector_tile_renderer: 6.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
