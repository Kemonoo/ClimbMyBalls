name: hibi_climbing_map
description: The climbing map (docs/climb/plan.md, step 4) - Mapy.com outdoor tiles, GPS, the near-me list, filters and the place hierarchy. Used by the standalone Climb app only; hibi does not depend on it.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_svg: ^2.4.0
  geolocator: ^14.1.2
  hibi_climbing:
    path: ../hibi_climbing
  latlong2: ^0.10.1
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
